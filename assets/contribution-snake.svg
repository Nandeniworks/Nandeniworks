<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="100%" height="100%">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#160829" />
      <stop offset="100%" stop-color="#0d0417" />
    </linearGradient>

    <linearGradient id="snakeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="neonSnakeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .snake-wave {
      animation: wavePulse 3s ease-in-out infinite alternate;
    }
    @keyframes wavePulse {
      0% { filter: drop-shadow(0 0 4px #a855f7); }
      100% { filter: drop-shadow(0 0 12px #f472b6); }
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="436" height="226" rx="12" fill="none" stroke="url(#snakeBorder)" stroke-width="1.8" filter="url(#neonSnakeGlow)" />
