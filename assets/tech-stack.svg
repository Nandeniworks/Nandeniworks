<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 430" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#160829" />
      <stop offset="100%" stop-color="#0d0417" />
    </linearGradient>

    <linearGradient id="techBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="tileBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241042" />
      <stop offset="100%" stop-color="#150828" />
    </linearGradient>

    <linearGradient id="pillTechGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0c3d" />
      <stop offset="100%" stop-color="#2b1150" />
    </linearGradient>

    <filter id="neonTechGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="saturnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .sec-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
    }
    .pill-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #f5d0fe;
    }
    .icon-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      fill: #e9d5ff;
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="376" height="426" rx="12" fill="none" stroke="url(#techBorder)" stroke-width="1.8" filter="url(#neonTechGlow)" />
  <!-- Card Background -->
  <rect x="3" y="3" width="374" height="424" rx="11" fill="url(#techBg)" />

  <!-- Window Header Bar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 366,3 A 11,11 0 0,1 377,14 L 377,36 L 3,36 Z" fill="#200d3d" />
  <line x1="3" y1="36" x2="377" y2="36" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Header Title: 💻 Tech Stack -->
  <text x="18" y="23" class="window-header" fill="#f0abfc">💻 Tech Stack</text>

  <!-- Window Controls (─  □  ✕) -->
  <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="320" y1="20" x2="328" y2="20" />
    <rect x="336" y="16" width="8" height="8" rx="1" />
    <line x1="352" y1="16" x2="360" y2="24" />
    <line x1="360" y1="16" x2="352" y2="24" />
  </g>

  <!-- Section 1: Development & Programming -->
  <g transform="translate(20, 56)">
    <text x="0" y="12" class="sec-title" fill="#c084fc">☆ Development &amp; Programming</text>

    <!-- Row 1 of Tech Icons: Python, HTML5, CSS3, JS, React -->
    <g transform="translate(0, 26)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#1e1b4b" />
        <text x="30" y="24" text-anchor="middle" font-size="16">🐍</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">Python</text>
      </g>
      <!-- HTML5 -->
      <g transform="translate(70, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#451a03" />
        <text x="30" y="24" text-anchor="middle" font-size="15" fill="#f97316" font-family="monospace" font-weight="900">5</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">HTML5</text>
      </g>
      <!-- CSS3 -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#172554" />
        <text x="30" y="24" text-anchor="middle" font-size="15" fill="#38bdf8" font-family="monospace" font-weight="900">3</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">CSS3</text>
      </g>
      <!-- JS -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#422006" />
        <text x="30" y="24" text-anchor="middle" font-size="14" fill="#facc15" font-family="sans-serif" font-weight="900">JS</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">JavaScript</text>
      </g>
      <!-- React -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#083344" />
        <text x="30" y="24" text-anchor="middle" font-size="16">⚛</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">React</text>
      </g>
    </g>

    <!-- Row 2 of Tech Icons: Node.js, C++, Git, GitHub, VS Code -->
    <g transform="translate(0, 92)">
      <!-- Node.js -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#052e16" />
        <text x="30" y="24" text-anchor="middle" font-size="14" fill="#4ade80" font-family="sans-serif" font-weight="900">node</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">Node.js</text>
      </g>
      <!-- C++ -->
      <g transform="translate(70, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#1e1b4b" />
        <text x="30" y="24" text-anchor="middle" font-size="14" fill="#60a5fa" font-family="monospace" font-weight="900">C++</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">C++</text>
      </g>
      <!-- Git -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#431407" />
        <text x="30" y="24" text-anchor="middle" font-size="15" fill="#f87171" font-family="sans-serif">🔀</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">Git</text>
      </g>
      <!-- GitHub -->
      <g transform="translate(210, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#1e293b" />
        <text x="30" y="24" text-anchor="middle" font-size="15">🐙</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">GitHub</text>
      </g>
      <!-- VS Code -->
      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="60" height="52" rx="8" fill="url(#tileBgGrad)" stroke="#7c3aed" stroke-width="1.2" />
        <circle cx="30" cy="20" r="14" fill="#0c4a6e" />
        <text x="30" y="24" text-anchor="middle" font-size="14" fill="#38bdf8">💻</text>
        <text x="30" y="44" text-anchor="middle" class="icon-label">VS Code</text>
      </g>
    </g>

  </g>

  <!-- Section 2: Creative Technology -->
  <g transform="translate(20, 235)">
    <text x="0" y="12" class="sec-title" fill="#f472b6">💜 Creative Technology</text>

    <!-- Pill Capsules Row 1 -->
    <g transform="translate(0, 28)">
      <!-- Unreal Engine 5 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="url(#pillTechGrad)" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
        <circle cx="16" cy="16" r="6" fill="#f472b6" opacity="0.8" />
        <text x="30" y="20" class="pill-label">Unreal Engine 5</text>
      </g>
      <!-- UI/UX -->
      <g transform="translate(140, 0)">
        <rect x="0" y="0" width="70" height="32" rx="16" fill="url(#pillTechGrad)" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
        <text x="35" y="20" text-anchor="middle" class="pill-label" fill="#f0abfc">UI/UX</text>
      </g>
      <!-- 3D Environment -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="120" height="32" rx="16" fill="url(#pillTechGrad)" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />
        <text x="60" y="20" text-anchor="middle" class="pill-label">3D Environment</text>
      </g>
    </g>

    <!-- Pill Capsules Row 2 -->
    <g transform="translate(0, 72)">
      <!-- Creative Development -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="155" height="32" rx="16" fill="url(#pillTechGrad)" stroke="#c084fc" stroke-width="1.2" />
        <text x="77" y="20" text-anchor="middle" class="pill-label">Creative Development</text>
      </g>
      <!-- Problem Solving -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="130" height="32" rx="16" fill="url(#pillTechGrad)" stroke="#c084fc" stroke-width="1.2" />
        <text x="65" y="20" text-anchor="middle" class="pill-label">Problem Solving</text>
      </g>
    </g>

    <!-- Glowing Cyber Saturn Planet (🪐) in Bottom Corner -->
    <g transform="translate(305, 115)" filter="url(#saturnGlow)">
      <!-- Planet Ball -->
      <circle cx="0" cy="0" r="16" fill="#a855f7" stroke="#f0abfc" stroke-width="1" />
      <circle cx="-3" cy="-3" r="14" fill="#c084fc" opacity="0.4" />
      <!-- Rings -->
      <ellipse cx="0" cy="0" rx="30" ry="7" fill="none" stroke="#f472b6" stroke-width="2.5" transform="rotate(-25 0 0)" />
      <ellipse cx="0" cy="0" rx="34" ry="9" fill="none" stroke="#e879f9" stroke-width="1" transform="rotate(-25 0 0)" opacity="0.6" stroke-dasharray="4,2" />
    </g>

  </g>

  <!-- Ambient Micro Star -->
  <text x="350" y="65" font-family="monospace" font-size="11" fill="#f0abfc" opacity="0.6">✧</text>
</svg>
