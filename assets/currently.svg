<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="100%" height="100%">
  <defs>
    <linearGradient id="currBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#150828" />
      <stop offset="100%" stop-color="#0e0419" />
    </linearGradient>

    <linearGradient id="currBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="neonCurrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="thumbClip1">
      <rect x="0" y="0" width="146" height="96" rx="8" />
    </clipPath>
    <clipPath id="thumbClip2">
      <rect x="0" y="0" width="146" height="96" rx="8" />
    </clipPath>
    <clipPath id="thumbClip3">
      <rect x="0" y="0" width="146" height="96" rx="8" />
    </clipPath>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .col-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 700;
    }
    .bullet-item {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11.5px;
      line-height: 1.5;
      fill: #e2d4f0;
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="516" height="426" rx="12" fill="none" stroke="url(#currBorder)" stroke-width="1.8" filter="url(#neonCurrGlow)" />
  <!-- Card Background -->
  <rect x="3" y="3" width="514" height="424" rx="11" fill="url(#currBg)" />

  <!-- Window Header Bar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 506,3 A 11,11 0 0,1 517,14 L 517,36 L 3,36 Z" fill="#200d3d" />
  <line x1="3" y1="36" x2="517" y2="36" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Header Title: ⊹ Currently -->
  <text x="18" y="23" class="window-header" fill="#f0abfc">⊹ Currently</text>

  <!-- Window Controls (─  □  ✕) -->
  <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="460" y1="20" x2="468" y2="20" />
    <rect x="476" y="16" width="8" height="8" rx="1" />
    <line x1="492" y1="16" x2="500" y2="24" />
    <line x1="500" y1="16" x2="492" y2="24" />
  </g>

  <!-- ================= COLUMN 1: LEARNING ================= -->
  <g transform="translate(18, 55)">
    <!-- Column Title -->
    <text x="0" y="15" class="col-title" fill="#f472b6">📖 Learning</text>
    
    <!-- Bullet List -->
    <g transform="translate(0, 38)" class="bullet-item">
      <text x="0" y="0"><tspan fill="#a855f7">•</tspan> React.js &amp; Node.js</text>
      <text x="0" y="22"><tspan fill="#a855f7">•</tspan> DSA &amp; Problem Solving</text>
      <text x="0" y="44"><tspan fill="#a855f7">•</tspan> Cybersecurity concepts</text>
      <text x="0" y="66"><tspan fill="#a855f7">•</tspan> Python</text>
      <text x="0" y="88"><tspan fill="#a855f7">•</tspan> AI &amp; Machine Learning</text>
      <text x="10" y="104" font-size="10" fill="#a78bfa">concepts</text>
    </g>

    <!-- Thumbnail Illustration (Laptop & Code) -->
    <g transform="translate(0, 240)">
      <rect x="-1" y="-1" width="148" height="98" rx="9" fill="none" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 2px 6px rgba(168,85,247,0.4))" />
      <g clip-path="url(#thumbClip1)">
        <image href="currently_learning.jpg" x="0" y="0" width="146" height="96" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>
  </g>

  <!-- Column Divider 1 -->
  <line x1="182" y1="55" x2="182" y2="405" stroke="#3b0764" stroke-dasharray="3,3" stroke-width="1" />

  <!-- ================= COLUMN 2: BUILDING ================= -->
  <g transform="translate(198, 55)">
    <!-- Column Title -->
    <text x="0" y="15" class="col-title" fill="#c084fc">🔨 Building</text>
    
    <!-- Bullet List -->
    <g transform="translate(0, 38)" class="bullet-item">
      <text x="0" y="0"><tspan fill="#f472b6">•</tspan> Creative web</text>
      <text x="10" y="16" font-size="10" fill="#a78bfa">experiences</text>

      <text x="0" y="44"><tspan fill="#f472b6">•</tspan> AI-powered</text>
      <text x="10" y="60" font-size="10" fill="#a78bfa">applications</text>

      <text x="0" y="88"><tspan fill="#f472b6">•</tspan> Interactive</text>
      <text x="10" y="104" font-size="10" fill="#a78bfa">interfaces</text>
    </g>

    <!-- Thumbnail Illustration (Cat on Balcony) -->
    <g transform="translate(0, 240)">
      <rect x="-1" y="-1" width="148" height="98" rx="9" fill="none" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 2px 6px rgba(168,85,247,0.4))" />
      <g clip-path="url(#thumbClip2)">
        <image href="currently_building.jpg" x="0" y="0" width="146" height="96" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>
  </g>

  <!-- Column Divider 2 -->
  <line x1="352" y1="55" x2="352" y2="405" stroke="#3b0764" stroke-dasharray="3,3" stroke-width="1" />

  <!-- ================= COLUMN 3: EXPLORING ================= -->
  <g transform="translate(366, 55)">
    <!-- Column Title -->
    <text x="0" y="15" class="col-title" fill="#e879f9">🔆 Exploring</text>
    
    <!-- Bullet List -->
    <g transform="translate(0, 38)" class="bullet-item">
      <text x="0" y="0"><tspan fill="#c084fc">•</tspan> Unreal Engine 5</text>
      <text x="0" y="24"><tspan fill="#c084fc">•</tspan> 3D environments</text>
      <text x="0" y="48"><tspan fill="#c084fc">•</tspan> UI/UX</text>
      <text x="0" y="72"><tspan fill="#c084fc">•</tspan> Creative coding</text>
    </g>

    <!-- Thumbnail Illustration (Cosmic Galaxy Moon) -->
    <g transform="translate(0, 240)">
      <rect x="-1" y="-1" width="148" height="98" rx="9" fill="none" stroke="#f472b6" stroke-width="1.2" filter="drop-shadow(0 2px 6px rgba(168,85,247,0.4))" />
      <g clip-path="url(#thumbClip3)">
        <image href="currently_exploring.jpg" x="0" y="0" width="146" height="96" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>
  </g>

  <!-- Sparkles -->
  <text x="500" y="70" font-family="monospace" font-size="10" fill="#c084fc" opacity="0.6">✧</text>
  <text x="175" y="415" font-family="monospace" font-size="9" fill="#f472b6" opacity="0.6">⋆</text>
</svg>
