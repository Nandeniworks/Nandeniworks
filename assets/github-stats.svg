<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 230" width="100%" height="100%">
  <defs>
    <linearGradient id="statsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#160829" />
      <stop offset="100%" stop-color="#0d0417" />
    </linearGradient>

    <linearGradient id="statsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="neonStatsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="flowerBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .user-title {
      font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #ffffff;
    }
    .sub-head {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #a855f7;
    }
    .stat-label {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      fill: #e9d5ff;
    }
    .stat-val {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #f472b6;
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="376" height="226" rx="12" fill="none" stroke="url(#statsBorder)" stroke-width="1.8" filter="url(#neonStatsGlow)" />
  <!-- Card Background -->
  <rect x="3" y="3" width="374" height="224" rx="11" fill="url(#statsBg)" />

  <!-- Window Header Bar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 366,3 A 11,11 0 0,1 377,14 L 377,32 L 3,32 Z" fill="#200d3d" />
  <line x1="3" y1="32" x2="377" y2="32" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Header Title: 📊 GitHub Stats -->
  <text x="18" y="21" class="window-header" fill="#f0abfc">📊 GitHub Stats</text>

  <!-- Window Controls (─ □ ✕) -->
  <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="320" y1="18" x2="328" y2="18" />
    <rect x="336" y="14" width="8" height="8" rx="1" />
    <line x1="352" y1="14" x2="360" y2="22" />
    <line x1="360" y1="14" x2="352" y2="22" />
  </g>

  <!-- Left Side: Glowing 5-Petal Cyber Flower Badge -->
  <g transform="translate(68, 125)">
    <!-- Outer Glow Frame Box -->
    <rect x="-48" y="-48" width="96" height="96" rx="12" fill="#1b0c33" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))" />
    <!-- 5 Blooming Petals -->
    <g filter="url(#flowerBloom)">
      <!-- Petal 1 -->
      <path d="M 0,0 C -14,-22 -10,-38 0,-42 C 10,-38 14,-22 0,0 Z" fill="#c084fc" stroke="#f0abfc" stroke-width="1" />
      <!-- Petal 2 -->
      <path d="M 0,0 C 18,-18 34,-14 38,-4 C 34,8 18,14 0,0 Z" fill="#a855f7" stroke="#f0abfc" stroke-width="1" />
      <!-- Petal 3 -->
      <path d="M 0,0 C 18,14 26,28 20,36 C 8,36 -2,22 0,0 Z" fill="#9333ea" stroke="#f0abfc" stroke-width="1" />
      <!-- Petal 4 -->
      <path d="M 0,0 C -14,22 -26,20 -30,12 C -28,2 -14,-2 0,0 Z" fill="#a855f7" stroke="#f0abfc" stroke-width="1" />
      <!-- Petal 5 -->
      <path d="M 0,0 C -22,-6 -34,-18 -32,-26 C -22,-30 -8,-16 0,0 Z" fill="#c084fc" stroke="#f0abfc" stroke-width="1" />
      <!-- Flower Core -->
      <circle cx="0" cy="0" r="9" fill="#f472b6" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>
    <!-- Micro Sparkles -->
    <text x="32" y="-30" font-family="monospace" font-size="9" fill="#ffffff">✧</text>
    <text x="-36" y="38" font-family="monospace" font-size="9" fill="#f472b6">⋆</text>
  </g>

  <!-- Right Side: Real GitHub Stats -->
  <g transform="translate(138, 52)">
    <!-- Username Header -->
    <text x="0" y="16" class="user-title">Nandeniworks</text>
    <text x="0" y="32" class="sub-head">GitHub Verified Profile</text>

    <!-- Stats Rows -->
    <g transform="translate(0, 52)" class="stat-label">
      <!-- Repos -->
      <g transform="translate(0, 0)">
        <text x="0" y="0">📁 Public Repositories:</text>
        <text x="145" y="0" class="stat-val">55</text>
      </g>
      <!-- Followers -->
      <g transform="translate(0, 22)">
        <text x="0" y="0">👥 Followers:</text>
        <text x="145" y="0" class="stat-val">6</text>
      </g>
      <!-- Location -->
      <g transform="translate(0, 44)">
        <text x="0" y="0">📍 Location:</text>
        <text x="145" y="0" class="stat-val" fill="#c084fc">India</text>
      </g>
      <!-- Campus -->
      <g transform="translate(0, 66)">
        <text x="0" y="0">🏢 Campus:</text>
        <text x="145" y="0" class="stat-val" font-size="10.5" fill="#e9d5ff">ITM Skills Univ</text>
      </g>
      <!-- Status -->
      <g transform="translate(0, 88)">
        <text x="0" y="0">⚡ Role:</text>
        <text x="145" y="0" class="stat-val" fill="#4ade80">Creative Dev</text>
      </g>
    </g>
  </g>

  <!-- Ambient Micro Star -->
  <text x="355" y="215" font-family="monospace" font-size="9" fill="#c084fc" opacity="0.6">✧</text>
</svg>
