<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="100%" height="100%">
  <defs>
    <linearGradient id="playerBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="50%" stop-color="#180b2c" />
      <stop offset="100%" stop-color="#0e051a" />
    </linearGradient>

    <linearGradient id="playerBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="scrubberFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <filter id="neonMusicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="albumArtClip">
      <rect x="0" y="0" width="110" height="110" rx="10" />
    </clipPath>
  </defs>

  <style>
    .sans-title {
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .mono-meta {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .eq-bar {
      animation: eqBounce 1.2s ease-in-out infinite alternate;
      transform-origin: bottom;
    }
    @keyframes eqBounce {
      0% { transform: scaleY(0.3); }
      100% { transform: scaleY(1); }
    }
  </style>

  <!-- Card Base & Outer Glow -->
  <rect x="2" y="2" width="276" height="316" rx="12" fill="url(#playerBgGrad)" stroke="url(#playerBorderGrad)" stroke-width="1.8" filter="url(#neonMusicGlow)" />

  <!-- Window Titlebar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 266,3 A 11,11 0 0,1 277,14 L 277,36 L 3,36 Z" fill="#200d3d" />
  <line x1="3" y1="36" x2="277" y2="36" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Title: Now Playing... -->
  <g class="mono-meta" font-size="11" font-weight="600">
    <text x="16" y="23" fill="#f0abfc">Now Playing...</text>
  </g>

  <!-- Window Controls (─ □ ✕) -->
  <g stroke="#f472b6" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="220" y1="20" x2="228" y2="20" />
    <rect x="236" y="16" width="8" height="8" rx="1" />
    <line x1="252" y1="16" x2="260" y2="24" />
    <line x1="260" y1="16" x2="252" y2="24" />
  </g>

  <!-- Album Art Thumbnail with Glow Border -->
  <g transform="translate(85, 52)">
    <rect x="-2" y="-2" width="114" height="114" rx="12" fill="none" stroke="#a855f7" stroke-width="1.5" filter="url(#neonMusicGlow)" />
    <g clip-path="url(#albumArtClip)">
      <image href="currently_exploring.jpg" x="0" y="0" width="110" height="110" preserveAspectRatio="xMidYMid slice" />
      <!-- Holographic vignette overlay -->
      <circle cx="55" cy="55" r="45" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.5" stroke-dasharray="3,3" />
    </g>
  </g>

  <!-- Track Info -->
  <g text-anchor="middle" transform="translate(140, 190)">
    <text x="0" y="0" class="sans-title" font-size="16" font-weight="700" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">dream.exe</text>
    <text x="0" y="18" class="mono-meta" font-size="11.5" font-weight="500" fill="#c084fc">Nandeni</text>
  </g>

  <!-- Equalizer Audio Visualizer Bars -->
  <g transform="translate(90, 225)" fill="#e879f9" opacity="0.85">
    <rect class="eq-bar" x="0" y="-12" width="3" height="14" rx="1.5" style="animation-duration: 0.8s;" />
    <rect class="eq-bar" x="8" y="-18" width="3" height="20" rx="1.5" style="animation-duration: 1.1s;" />
    <rect class="eq-bar" x="16" y="-8" width="3" height="10" rx="1.5" style="animation-duration: 0.6s;" />
    <rect class="eq-bar" x="24" y="-22" width="3" height="24" rx="1.5" style="animation-duration: 1.3s;" />
    <rect class="eq-bar" x="32" y="-14" width="3" height="16" rx="1.5" style="animation-duration: 0.9s;" />
    <rect class="eq-bar" x="40" y="-20" width="3" height="22" rx="1.5" style="animation-duration: 1.2s;" />
    <rect class="eq-bar" x="48" y="-10" width="3" height="12" rx="1.5" style="animation-duration: 0.7s;" />
    <rect class="eq-bar" x="56" y="-24" width="3" height="26" rx="1.5" style="animation-duration: 1.4s;" />
    <rect class="eq-bar" x="64" y="-16" width="3" height="18" rx="1.5" style="animation-duration: 1.0s;" />
    <rect class="eq-bar" x="72" y="-12" width="3" height="14" rx="1.5" style="animation-duration: 0.8s;" />
    <rect class="eq-bar" x="80" y="-19" width="3" height="21" rx="1.5" style="animation-duration: 1.1s;" />
    <rect class="eq-bar" x="88" y="-9" width="3" height="11" rx="1.5" style="animation-duration: 0.6s;" />
    <rect class="eq-bar" x="96" y="-15" width="3" height="17" rx="1.5" style="animation-duration: 0.95s;" />
  </g>

  <!-- Progress Scrubber Bar -->
  <g transform="translate(25, 245)">
    <!-- Track line background -->
    <rect x="0" y="0" width="230" height="4" rx="2" fill="#2d1254" />
    <!-- Track line played -->
    <rect x="0" y="0" width="135" height="4" rx="2" fill="url(#scrubberFill)" />
    <!-- Scrubber glow knob -->
    <circle cx="135" cy="2" r="5" fill="#ffffff" filter="url(#neonMusicGlow)" />
    <!-- Timers -->
    <text x="0" y="16" class="mono-meta" font-size="9.5" fill="#a855f7">1:24</text>
    <text x="230" y="16" text-anchor="end" class="mono-meta" font-size="9.5" fill="#a855f7">3:45</text>
  </g>

  <!-- Player Controls (◀◀  ▶⏸  ▶▶) -->
  <g transform="translate(140, 285)" fill="#f5d0fe">
    <!-- Previous |◀◀ -->
    <g transform="translate(-52, 0)" cursor="pointer">
      <path d="M -8,-6 L -1,0 L -8,6 Z" fill="#e879f9" />
      <path d="M 0,-6 L 7,0 L 0,6 Z" fill="#e879f9" />
      <line x1="-10" y1="-6" x2="-10" y2="6" stroke="#e879f9" stroke-width="2" />
    </g>

    <!-- Play/Pause Pill Button ▶⏸ with Neon Halo -->
    <g transform="translate(0, 0)" cursor="pointer">
      <circle cx="0" cy="0" r="16" fill="#7c3aed" stroke="#f0abfc" stroke-width="1.8" filter="url(#neonMusicGlow)" />
      <!-- Play icon / Pause bars -->
      <line x1="-4" y1="-5" x2="-4" y2="5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <line x1="3" y1="-5" x2="3" y2="5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Next ▶▶| -->
    <g transform="translate(52, 0)" cursor="pointer">
      <path d="M 8,-6 L 1,0 L 8,6 Z" fill="#e879f9" transform="scale(-1, 1)" />
      <path d="M 0,-6 L -7,0 L 0,6 Z" fill="#e879f9" transform="scale(-1, 1)" />
      <line x1="10" y1="-6" x2="10" y2="6" stroke="#e879f9" stroke-width="2" />
    </g>
  </g>

  <!-- Corner Sparkles -->
  <text x="18" y="55" font-family="monospace" font-size="11" fill="#c084fc" opacity="0.6">✧</text>
  <text x="250" y="220" font-family="monospace" font-size="10" fill="#f472b6" opacity="0.6">⋆</text>
</svg>
