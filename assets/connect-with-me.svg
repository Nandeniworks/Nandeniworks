<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 140" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#160829" />
      <stop offset="100%" stop-color="#0d0417" />
    </linearGradient>

    <linearGradient id="connBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241042" />
      <stop offset="100%" stop-color="#190a30" />
    </linearGradient>

    <filter id="neonConnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }
    .btn-sub {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: #c084fc;
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="326" height="136" rx="12" fill="none" stroke="url(#connBorder)" stroke-width="1.8" filter="url(#neonConnGlow)" />
  <!-- Card Background -->
  <rect x="3" y="3" width="324" height="134" rx="11" fill="url(#connBg)" />

  <!-- Window Header Bar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 316,3 A 11,11 0 0,1 327,14 L 327,32 L 3,32 Z" fill="#200d3d" />
  <line x1="3" y1="32" x2="327" y2="32" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Header Title: 🔮 Connect With Me -->
  <text x="16" y="21" class="window-header" fill="#f0abfc">🔮 Connect With Me</text>

  <!-- Micro Saturn Planet decoration on right header -->
  <g transform="translate(295, 18)">
    <circle cx="0" cy="0" r="5" fill="#f472b6" />
    <ellipse cx="0" cy="0" rx="10" ry="2.5" fill="none" stroke="#c084fc" stroke-width="1" transform="rotate(-20 0 0)" />
  </g>

  <!-- Buttons Container -->
  <g transform="translate(16, 48)">
    
    <!-- GitHub Button -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="142" height="68" rx="10" fill="url(#btnGrad)" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.6))" />
      <circle cx="30" cy="34" r="16" fill="#1e0b38" stroke="#a855f7" stroke-width="1" />
      <!-- Octocat silhouette -->
      <path d="M 30,23 C 24,23 19,28 19,34 C 19,39 22,43 27,44.5 C 27.5,44.6 27.7,44.3 27.7,44 C 27.7,43.8 27.7,43 27.7,42 C 24.6,42.7 24,40.5 24,40.5 C 23.5,39.2 22.8,38.8 22.8,38.8 C 21.8,38.1 22.9,38.1 22.9,38.1 C 24,38.2 24.6,39.2 24.6,39.2 C 25.6,40.9 27.2,40.4 27.8,40.1 C 27.9,39.4 28.2,38.9 28.5,38.6 C 26,38.3 23.4,37.3 23.4,33 C 23.4,31.8 23.8,30.8 24.5,30 C 24.4,29.7 24,28.5 24.6,27 C 24.6,27 25.5,26.7 27.5,28.1 C 28.4,27.8 29.3,27.7 30.2,27.7 C 31.1,27.7 32,27.8 32.9,28.1 C 34.9,26.7 35.8,27 35.8,27 C 36.4,28.5 36,29.7 35.9,30 C 36.6,30.8 37,31.8 37,33 C 37,37.3 34.4,38.3 31.9,38.6 C 32.3,39 32.7,39.7 32.7,40.8 C 32.7,42.4 32.7,43.7 32.7,44 C 32.7,44.3 32.9,44.6 33.4,44.5 C 38.3,43 41.4,39 41.4,34 C 41.4,28 36.4,23 30,23 Z" fill="#ffffff" />
      <text x="56" y="30" class="btn-title">GitHub</text>
      <text x="56" y="46" class="btn-sub">Nandeniworks</text>
    </g>

    <!-- LinkedIn Button -->
    <g transform="translate(156, 0)">
      <rect x="0" y="0" width="142" height="68" rx="10" fill="url(#btnGrad)" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.6))" />
      <circle cx="30" cy="34" r="16" fill="#1e0b38" stroke="#a855f7" stroke-width="1" />
      <!-- 'in' symbol -->
      <rect x="22" y="26" width="16" height="16" rx="3" fill="#0077b5" />
      <text x="30" y="38" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#ffffff">in</text>
      <text x="56" y="30" class="btn-title">LinkedIn</text>
      <text x="56" y="46" class="btn-sub">Nandeni Tiwari</text>
    </g>

  </g>
</svg>
