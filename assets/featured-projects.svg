<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120622" />
      <stop offset="50%" stop-color="#150828" />
      <stop offset="100%" stop-color="#0e0419" />
    </linearGradient>

    <linearGradient id="projBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardInnerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0b36" />
      <stop offset="100%" stop-color="#100520" />
    </linearGradient>

    <filter id="neonProjGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="projClip1">
      <rect x="0" y="0" width="148" height="102" rx="6" />
    </clipPath>
    <clipPath id="projClip2">
      <rect x="0" y="0" width="148" height="102" rx="6" />
    </clipPath>
    <clipPath id="projClip3">
      <rect x="0" y="0" width="148" height="102" rx="6" />
    </clipPath>
  </defs>

  <style>
    .window-header {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .proj-title {
      font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      fill: #ffffff;
    }
    .proj-desc {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 11px;
      line-height: 1.5;
      fill: #d8b4fe;
    }
    .card-hover {
      transition: transform 0.3s ease;
    }
  </style>

  <!-- Outer Neon Glow Frame -->
  <rect x="2" y="2" width="516" height="426" rx="12" fill="none" stroke="url(#projBorder)" stroke-width="1.8" filter="url(#neonProjGlow)" />
  <!-- Card Background -->
  <rect x="3" y="3" width="514" height="424" rx="11" fill="url(#projBg)" />

  <!-- Window Header Bar -->
  <path d="M 3,14 A 11,11 0 0,1 14,3 L 506,3 A 11,11 0 0,1 517,14 L 517,36 L 3,36 Z" fill="#200d3d" />
  <line x1="3" y1="36" x2="517" y2="36" stroke="#4c1d95" stroke-width="1.2" />

  <!-- Header Title: </> Featured Projects -->
  <text x="18" y="23" class="window-header" fill="#f0abfc">&lt;/&gt; Featured Projects</text>
  <!-- Link: view all → -->
  <text x="495" y="23" text-anchor="end" class="window-header" font-size="11" fill="#c084fc">view all →</text>

  <!-- ================= PROJECT 1: BRITESeats ================= -->
  <g transform="translate(16, 52)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="154" height="355" rx="8" fill="url(#cardInnerBg)" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))" />
    
    <!-- Thumbnail Image -->
    <g transform="translate(3, 3)">
      <rect x="0" y="0" width="148" height="102" rx="6" fill="#000" />
      <g clip-path="url(#projClip1)">
        <image href="project_briteseats.jpg" x="0" y="0" width="148" height="102" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>

    <!-- Project Info -->
    <g transform="translate(10, 126)">
      <text x="0" y="10" class="proj-title">BriteSeats</text>
      
      <!-- Description -->
      <text x="0" y="34" class="proj-desc">
        <tspan x="0" dy="0">A React-based ticket</tspan>
        <tspan x="0" dy="17">booking experience with</tspan>
        <tspan x="0" dy="17">interactive seat selection,</tspan>
        <tspan x="0" dy="17">venue exploration, and</tspan>
        <tspan x="0" dy="17">digital tickets.</tspan>
      </text>

      <!-- Arrow Button at Bottom -->
      <g transform="translate(112, 195)">
        <circle cx="10" cy="10" r="12" fill="#2d1254" stroke="#a855f7" stroke-width="1" />
        <text x="10" y="14" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="700">→</text>
      </g>
    </g>
  </g>

  <!-- ================= PROJECT 2: MEDIVAULT ================= -->
  <g transform="translate(182, 52)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="154" height="355" rx="8" fill="url(#cardInnerBg)" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))" />
    
    <!-- Thumbnail Image -->
    <g transform="translate(3, 3)">
      <rect x="0" y="0" width="148" height="102" rx="6" fill="#000" />
      <g clip-path="url(#projClip2)">
        <image href="project_medivault.jpg" x="0" y="0" width="148" height="102" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>

    <!-- Project Info -->
    <g transform="translate(10, 126)">
      <text x="0" y="10" class="proj-title">MediVault</text>
      
      <!-- Description -->
      <text x="0" y="34" class="proj-desc">
        <tspan x="0" dy="0">A digital medical</tspan>
        <tspan x="0" dy="17">identity concept</tspan>
        <tspan x="0" dy="17">focused on organizing</tspan>
        <tspan x="0" dy="17">medical information</tspan>
        <tspan x="0" dy="17">securely.</tspan>
      </text>

      <!-- Arrow Button at Bottom -->
      <g transform="translate(112, 195)">
        <circle cx="10" cy="10" r="12" fill="#2d1254" stroke="#a855f7" stroke-width="1" />
        <text x="10" y="14" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="700">→</text>
      </g>
    </g>
  </g>

  <!-- ================= PROJECT 3: REALM ================= -->
  <g transform="translate(348, 52)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="154" height="355" rx="8" fill="url(#cardInnerBg)" stroke="#7c3aed" stroke-width="1.2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))" />
    
    <!-- Thumbnail Image -->
    <g transform="translate(3, 3)">
      <rect x="0" y="0" width="148" height="102" rx="6" fill="#000" />
      <g clip-path="url(#projClip3)">
        <image href="project_realm.jpg" x="0" y="0" width="148" height="102" preserveAspectRatio="xMidYMid slice" />
      </g>
    </g>

    <!-- Project Info -->
    <g transform="translate(10, 126)">
      <text x="0" y="10" class="proj-title">Realm</text>
      
      <!-- Description -->
      <text x="0" y="34" class="proj-desc">
        <tspan x="0" dy="0">A watch-party</tspan>
        <tspan x="0" dy="17">experience concept</tspan>
        <tspan x="0" dy="17">featuring synchronized</tspan>
        <tspan x="0" dy="17">YouTube playback</tspan>
        <tspan x="0" dy="17">and real-time chat.</tspan>
      </text>

      <!-- Arrow Button at Bottom -->
      <g transform="translate(112, 195)">
        <circle cx="10" cy="10" r="12" fill="#2d1254" stroke="#a855f7" stroke-width="1" />
        <text x="10" y="14" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="700">→</text>
      </g>
    </g>
  </g>

  <!-- Sparkles -->
  <text x="500" y="415" font-family="monospace" font-size="10" fill="#f472b6" opacity="0.6">✧</text>
</svg>
