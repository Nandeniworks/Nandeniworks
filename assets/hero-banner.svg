<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" height="100%">
  <defs>
    <!-- Glowing Neon Filters -->
    <filter id="heroTextGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softPillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleAura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="heroNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fdf4ff" />
      <stop offset="50%" stop-color="#f0abfc" />
      <stop offset="75%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <linearGradient id="orbitRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c0b38" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#2d1254" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1c0b38" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="centerHeroAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#090314" stop-opacity="0" />
    </radialGradient>

    <clipPath id="bunnyBubbleClip">
      <circle cx="1010" cy="115" r="50" />
    </clipPath>

    <clipPath id="polaroidClip">
      <rect x="52" y="48" width="60" height="60" rx="4" />
    </clipPath>
  </defs>

  <style>
    .hero-font {
      font-family: 'Cinzel Decorative', 'Playfair Display', 'Outfit', 'Georgia', serif;
      font-weight: 700;
    }
    .sub-font {
      font-family: 'Montserrat', 'Inter', -apple-system, sans-serif;
      letter-spacing: 3.5px;
    }
    .pill-font {
      font-family: 'Inter', -apple-system, sans-serif;
      letter-spacing: 1px;
    }
    .mono-card {
      font-family: 'Consolas', 'Courier New', monospace;
    }
    .float-slow {
      animation: floatHero 4s ease-in-out infinite alternate;
    }
    .sparkle-twinkle {
      animation: sparkleFade 2s ease-in-out infinite alternate;
    }
    @keyframes floatHero {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-5px); }
    }
    @keyframes sparkleFade {
      0% { opacity: 0.3; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }
  </style>

  <!-- Ambient Hero Backdrop Aura -->
  <ellipse cx="600" cy="115" rx="380" ry="110" fill="url(#centerHeroAura)" filter="url(#subtleAura)" />

  <!-- ================= LEFT DECORATIONS: RETRO POLAROID & STEPS ================= -->
  <g class="float-slow" transform="translate(10, 0)">
    <!-- Polaroid Frame Background -->
    <rect x="45" y="40" width="74" height="92" rx="6" fill="#1b0c33" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.7))" />
    <!-- Polaroid Thumbnail Image -->
    <g clip-path="url(#polaroidClip)">
      <image href="currently_exploring.jpg" x="48" y="45" width="70" height="70" preserveAspectRatio="xMidYMid slice" />
    </g>
    <!-- Little Heart on Polaroid Tape -->
    <rect x="67" y="34" width="30" height="10" rx="3" fill="#f472b6" opacity="0.85" />
    <text x="82" y="122" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#e9d5ff">VIBE.PNG</text>

    <!-- Mini Steps Box (01 CREATE, 02 CODE...) -->
    <g transform="translate(132, 48)">
      <rect x="0" y="0" width="82" height="85" rx="6" fill="#130726" stroke="#7c3aed" stroke-width="1.2" opacity="0.9" />
      <g class="mono-card" font-size="9" font-weight="600">
        <text x="8" y="18" fill="#f0abfc"><tspan fill="#a855f7">01</tspan> CREATE</text>
        <text x="8" y="32" fill="#e879f9"><tspan fill="#a855f7">02</tspan> CODE</text>
        <text x="8" y="46" fill="#c084fc"><tspan fill="#a855f7">03</tspan> DESIGN</text>
        <text x="8" y="60" fill="#a78bfa"><tspan fill="#a855f7">04</tspan> EXPLORE</text>
        <text x="8" y="74" fill="#38bdf8"><tspan fill="#a855f7">05</tspan> EVOLVE</text>
      </g>
    </g>

    <!-- Floating Purple Butterfly (Left) -->
    <g transform="translate(230, 95) scale(0.85)" filter="url(#heroTextGlow)">
      <path d="M 0,0 C -15,-20 -28,-10 -20,5 C -15,15 0,3 0,0 Z" fill="#d946ef" opacity="0.85" />
      <path d="M 0,0 C -10,8 -18,22 -6,22 C 0,22 0,5 0,0 Z" fill="#a855f7" opacity="0.85" />
      <path d="M 0,0 C 15,-20 28,-10 20,5 C 15,15 0,3 0,0 Z" fill="#d946ef" opacity="0.85" />
      <path d="M 0,0 C 10,8 18,22 6,22 C 0,22 0,5 0,0 Z" fill="#a855f7" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- ================= CENTER HERO: NAME & CELESTIAL ORBITS ================= -->
  <g id="centerHeroContent">
    
    <!-- Giant Celestial Orbiting Rings behind/through the name -->
    <ellipse cx="600" cy="98" rx="360" ry="46" fill="none" stroke="url(#orbitRingGrad)" stroke-width="2" transform="rotate(-7 600 98)" stroke-dasharray="14,6,4,6" filter="url(#heroTextGlow)" opacity="0.75" />
    <ellipse cx="600" cy="98" rx="380" ry="54" fill="none" stroke="#f472b6" stroke-width="1.2" transform="rotate(5 600 98)" opacity="0.4" />

    <!-- Sparkle Stars surrounding Name -->
    <g class="sparkle-twinkle" fill="#ffffff" filter="url(#heroTextGlow)">
      <path d="M 285,65 Q 295,65 295,55 Q 295,65 305,65 Q 295,65 295,75 Q 295,65 285,65 Z" fill="#f0abfc" />
      <path d="M 915,62 Q 925,62 925,52 Q 925,62 935,62 Q 925,62 925,72 Q 925,62 915,62 Z" fill="#ffffff" />
      <path d="M 330,135 Q 338,135 338,127 Q 338,135 346,135 Q 338,135 338,143 Q 338,135 330,135 Z" fill="#e879f9" />
      <path d="M 875,130 Q 883,130 883,122 Q 883,130 891,130 Q 883,130 883,138 Q 883,130 875,130 Z" fill="#f472b6" />
    </g>

    <!-- Main Title: Nandeni Tiwari -->
    <g text-anchor="middle" transform="translate(600, 105)">
      <!-- Neon Bloom Duplicate -->
      <text x="0" y="0" class="hero-font" font-size="58" fill="#a855f7" filter="url(#heroTextGlow)" opacity="0.8">
        ✦ Nandeni Tiwari ✦
      </text>
      <!-- Crisp Foreground Text -->
      <text x="0" y="0" class="hero-font" font-size="58" fill="url(#heroNameGrad)" filter="drop-shadow(0 0 10px rgba(240, 171, 252, 0.7))">
        ✦ Nandeni Tiwari ✦
      </text>
    </g>

    <!-- Subtitle: Developer Track -->
    <g text-anchor="middle" transform="translate(600, 142)">
      <text x="0" y="0" class="sub-font" font-size="12" font-weight="700" fill="#e9d5ff">
        AI <tspan fill="#a855f7">|</tspan> PYTHON <tspan fill="#a855f7">|</tspan> FRONTEND <tspan fill="#a855f7">|</tspan> UNREAL ENGINE <tspan fill="#a855f7">|</tspan> CREATIVE DEVELOPER
      </text>
    </g>

    <!-- Pill Capsule Badge: Tagline -->
    <g transform="translate(600, 192)" text-anchor="middle">
      <!-- Pill Outer Neon Glow -->
      <rect x="-260" y="-18" width="520" height="36" rx="18" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#softPillGlow)" />
      <!-- Pill Text -->
      <text x="0" y="5" class="pill-font" font-size="12.5" font-weight="500" fill="#f5d0fe">
        Building creative experiences <tspan fill="#ffffff" text-decoration="underline">through code</tspan>, <tspan fill="#ffffff" text-decoration="underline">design</tspan>, and <tspan fill="#ffffff" text-decoration="underline">technology</tspan> <tspan fill="#f472b6">♡</tspan>
      </text>
    </g>

  </g>

  <!-- ================= RIGHT DECORATIONS: BUNNY BUBBLE & CYBER TAG ================= -->
  <g class="float-slow" transform="translate(10, 0)">
    
    <!-- Holographic Bubble Sphere with Cyber Bunny -->
    <g>
      <!-- Outer Bubble Glow Aura -->
      <circle cx="1010" cy="115" r="54" fill="none" stroke="#e879f9" stroke-width="2" filter="url(#heroTextGlow)" />
      <circle cx="1010" cy="115" r="52" fill="#200a3d" opacity="0.8" />
      <!-- Clipped Bunny Image -->
      <g clip-path="url(#bunnyBubbleClip)">
        <image href="cyber_bunny_bubble.jpg" x="960" y="65" width="100" height="100" preserveAspectRatio="xMidYMid slice" />
      </g>
      <!-- Crystal Iridescent Ring around bubble -->
      <ellipse cx="1010" cy="115" rx="62" ry="18" fill="none" stroke="#f0abfc" stroke-width="1.8" transform="rotate(-25 1010 115)" opacity="0.8" stroke-dasharray="8,4" />
      <!-- Specular Highlight on Glass -->
      <ellipse cx="985" cy="85" rx="14" ry="7" fill="#ffffff" opacity="0.6" transform="rotate(-35 985 85)" />
    </g>

    <!-- Hanging Bead Chain & Cyber Tag ("same girl... different ideas.") -->
    <g transform="translate(1085, 30)">
      <!-- Bead Chain -->
      <circle cx="20" cy="10" r="2" fill="#c084fc" />
      <circle cx="25" cy="18" r="2" fill="#f472b6" />
      <circle cx="30" cy="26" r="2" fill="#c084fc" />
      <circle cx="36" cy="34" r="2" fill="#f472b6" />
      <circle cx="42" cy="42" r="2.5" fill="#ffffff" />
      <!-- Hanging Tag Frame (Angled) -->
      <g transform="rotate(12 50 60)">
        <rect x="0" y="35" width="108" height="38" rx="6" fill="#1d0a36" stroke="#f472b6" stroke-width="1.4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.8))" />
        <circle cx="10" cy="54" r="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" />
        <text x="20" y="50" class="mono-card" font-size="8.5" fill="#f5d0fe" font-weight="600">same girl...</text>
        <text x="20" y="63" class="mono-card" font-size="8.5" fill="#f472b6" font-weight="700">different ideas. ♡</text>
      </g>
    </g>

    <!-- Floating Neon Butterfly (Right) -->
    <g transform="translate(940, 180) scale(0.8)" filter="url(#heroTextGlow)">
      <path d="M 0,0 C -15,-20 -28,-10 -20,5 C -15,15 0,3 0,0 Z" fill="#f472b6" opacity="0.85" />
      <path d="M 0,0 C -10,8 -18,22 -6,22 C 0,22 0,5 0,0 Z" fill="#c084fc" opacity="0.85" />
      <path d="M 0,0 C 15,-20 28,-10 20,5 C 15,15 0,3 0,0 Z" fill="#f472b6" opacity="0.85" />
      <path d="M 0,0 C 10,8 18,22 6,22 C 0,22 0,5 0,0 Z" fill="#c084fc" opacity="0.85" />
      <circle cx="0" cy="0" r="2" fill="#ffffff" />
    </g>

  </g>

  <!-- Floating Sparkles everywhere -->
  <g fill="#ffffff" opacity="0.75" class="sparkle-twinkle">
    <circle cx="270" cy="35" r="1.5" />
    <circle cx="480" cy="45" r="1.5" />
    <circle cx="720" cy="42" r="1.8" />
    <circle cx="1140" cy="190" r="1.5" />
    <circle cx="80" cy="180" r="1.2" />
    <text x="600" y="24" font-family="'Courier New', monospace" font-size="14" fill="#f0abfc" text-anchor="middle">✧</text>
  </g>
</svg>
